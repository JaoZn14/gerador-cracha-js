<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Crachá</title>
</head>
<body>
    <h1>Gerador de Crachá</h1>

    <script>
        let nome = prompt("Digite seu nome:");
        let sobrenome = prompt("Digite seu sobrenome:");
        let anoNascimento = prompt("Digite seu ano de nascimento:");

        while (anoNascimento >= 2027) {
            alert("Digite um ano de nascimento menor que 2027.");
            anoNascimento = prompt("Digite seu ano de nascimento novamente:");
        }

        let alunoAtivo = confirm("É aluno ativo da instituição?");

        let anoAtual = new Date().getFullYear();
        let idade = anoAtual - anoNascimento;

        document.write("<h2>CRACHÁ VIRTUAL: " + nome + " " + sobrenome + "</h2>");
        document.write("<p>Idade estimada: " + idade + " anos.</p>");
        document.write("<p>O seu primeiro nome tem " + nome.length + " letras.</p>");
        document.write("<p>Status de aluno ativo: " + (alunoAtivo ? "Sim" : "Não") + "</p>");
    </script>
</body>
</html>
